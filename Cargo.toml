[package]
name = "rusty_budget"
version = "2.0.3-dev.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
chrono = { version = "0.4.42", features = ["serde"] }
clap = { version = "4.5.53", features = ["derive"] }
csv = "1.4.0"
env_logger = "0.11.8"
log = "0.4.29"
serde = { version = "1.0.228", features = ["derive"] }
serde_with = "3.16.1"
serde_yaml = "0.9.34"
thiserror = "2.0.18"
uuid = { version = "1.19.0", features = ["v4", "serde"] }

[dev-dependencies]
assert_cmd = "2.1.1"
indoc = "2.0.7"
parameterized = "2.1.0"
predicates = "3.1.3"
tempfile = "3.24.0"
